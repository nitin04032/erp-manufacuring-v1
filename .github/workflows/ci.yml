name: CI

# AUDIT_REPORT.md §1.5 found no CI gate existed at all — the only workflow
# in this repo was a supply-chain provenance generator, not a build/test
# gate. This is that gate: every push/PR now actually builds and tests both
# apps before merge is possible.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: erp-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        # Was report-only (continue-on-error) at first: 91 pre-existing lint
        # errors / 8 warnings existed repo-wide when this workflow was added,
        # predating it. That cleanup pass has since landed (repo-wide
        # eslint --fix formatting pass + every real @typescript-eslint/
        # no-unsafe-*, no-base-to-string, and unbound-method finding fixed
        # file by file) — zero errors/warnings now, so this is a real gate.
        # Deliberately `eslint` directly, not `npm run lint` (which runs
        # --fix) — CI should fail on a fixable issue, not silently fix it
        # in the ephemeral runner and pass.
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: erp-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
