name: CI

# AUDIT_REPORT.md §1.5 found no CI gate existed at all — the only workflow
# in this repo was a supply-chain provenance generator, not a build/test
# gate. This is that gate: every push/PR now actually builds and tests both
# apps before merge is possible.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: erp-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint (report only — not a merge gate yet)
        # 91 pre-existing lint errors / 8 warnings exist repo-wide as of the
        # Phase 1 CI setup (mostly @typescript-eslint/no-unsafe-* on `any`
        # values), predating this workflow. Fixing them is a dedicated,
        # separately-reviewed pass (touches many files' typing, not
        # something to bundle silently into infra setup) — tracked, not
        # ignored. Flip this to a hard gate once that pass lands.
        run: npm run lint
        continue-on-error: true

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: erp-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
